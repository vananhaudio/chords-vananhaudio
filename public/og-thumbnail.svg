<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#020c06"/>
      <stop offset="50%"  stop-color="#061410"/>
      <stop offset="100%" stop-color="#030a08"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#14532d" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="50%" r="45%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#166534" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid texture -->
  <g stroke="#14532d" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Vertical divider -->
  <line x1="590" y1="60" x2="590" y2="570" stroke="#22c55e" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- ════════════════════════════
       LEFT — Text block
  ════════════════════════════ -->

  <!-- Small label -->
  <text x="72" y="108"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="17" font-weight="700"
    fill="#4ade80" letter-spacing="4">LUYỆN TẬP GUITAR</text>

  <!-- Main headline line 1 -->
  <text x="68" y="192"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="76" font-weight="900"
    fill="#f1f5f9" letter-spacing="-1">Bài tập lớp</text>

  <!-- Main headline line 2 -->
  <text x="68" y="276"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="76" font-weight="900"
    fill="#f1f5f9" letter-spacing="-1">guitar</text>

  <!-- Accent bar -->
  <rect x="68" y="293" width="260" height="5" rx="2.5" fill="url(#accentLine)"/>

  <!-- Sub label -->
  <text x="70" y="344"
    font-family="Arial, sans-serif"
    font-size="27" font-weight="400"
    fill="#94a3b8">Khoá học của</text>

  <!-- Teacher name — hero treatment -->
  <text x="68" y="400"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="52" font-weight="900"
    fill="#22c55e" letter-spacing="-0.5">Thầy Văn Anh</text>

  <!-- Tagline -->
  <text x="70" y="444"
    font-family="Arial, sans-serif"
    font-size="20" font-weight="400"
    fill="#334155">Hệ thống bài tập học đàn guitar</text>
  <text x="70" y="468"
    font-family="Arial, sans-serif"
    font-size="20" font-weight="400"
    fill="#334155">nhận diện âm thanh realtime</text>

  <!-- Guitar illustration (stylised acoustic) -->
  <g transform="translate(78, 480)" opacity="0.80">
    <!-- Neck -->
    <rect x="192" y="-120" width="22" height="100" rx="5" fill="#1a3a22" stroke="#2d5c38" stroke-width="1.2"/>
    <!-- Upper bout -->
    <ellipse cx="203" cy="20" rx="62" ry="72" fill="#1a3a22" stroke="#2d5c38" stroke-width="1.5"/>
    <!-- Waist -->
    <ellipse cx="203" cy="90" rx="44" ry="24" fill="#061410"/>
    <!-- Lower bout -->
    <ellipse cx="203" cy="140" rx="78" ry="88" fill="#1a3a22" stroke="#2d5c38" stroke-width="1.5"/>
    <!-- Sound hole -->
    <circle cx="203" cy="128" r="30" fill="#030a08" stroke="#2d5c38" stroke-width="1.5"/>
    <circle cx="203" cy="128" r="26" fill="none" stroke="#c8922a" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- Bridge -->
    <rect x="172" y="176" width="60" height="8" rx="3" fill="#c8922a"/>
    <!-- Strings -->
    <line x1="194" y1="-22" x2="194" y2="182" stroke="#64748b" stroke-opacity="0.45" stroke-width="1"/>
    <line x1="198" y1="-22" x2="198" y2="182" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.1"/>
    <line x1="202" y1="-22" x2="202" y2="182" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
    <line x1="206" y1="-22" x2="206" y2="182" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="210" y1="-22" x2="210" y2="182" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.7"/>
    <line x1="214" y1="-22" x2="214" y2="182" stroke="#64748b" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- Logo + domain bottom-left -->
  <image href="/Logo_C#_xanh_dậm_#14532D.png" x="52" y="548" width="48" height="48"/>
  <text x="112" y="566"
    font-family="Arial" font-size="14" font-weight="700" fill="#22c55e">C# Guitar</text>
  <text x="112" y="585"
    font-family="Arial" font-size="12" font-weight="400" fill="#1e3a2a">Thầy Văn Anh · Guitar</text>

  <!-- ════════════════════════════
       RIGHT — Am chord diagram card
  ════════════════════════════ -->
  <g transform="translate(620, 60)">
    <!-- Card -->
    <rect x="0" y="0" width="510" height="510" rx="28"
      fill="#0c1f16" stroke="#22c55e" stroke-opacity="0.22" stroke-width="1.5"/>

    <!-- "Am" badge -->
    <rect x="190" y="22" width="130" height="44" rx="14"
      fill="#14532d" stroke="#22c55e" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="255" y="51"
      font-family="'Arial Black', Impact, sans-serif"
      font-size="26" font-weight="900" fill="#4ade80" text-anchor="middle">Am</text>

    <!-- Diagram grid -->
    <g transform="translate(60, 105)">
      <!-- Nut -->
      <rect x="0" y="0" width="360" height="10" rx="4" fill="#c8922a"/>

      <!-- Fret lines -->
      <line x1="0" y1="94"  x2="360" y2="94"  stroke="#1c3a28" stroke-width="2"/>
      <line x1="0" y1="178" x2="360" y2="178" stroke="#1c3a28" stroke-width="2"/>
      <line x1="0" y1="262" x2="360" y2="262" stroke="#1c3a28" stroke-width="2"/>

      <!-- Fret numbers -->
      <text x="378" y="56"  font-family="Arial" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">1</text>
      <text x="378" y="140" font-family="Arial" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">2</text>

      <!-- String lines -->
      <line x1="0"   y1="10" x2="0"   y2="262" stroke="#2a1a1a" stroke-width="3.5"/>
      <line x1="72"  y1="10" x2="72"  y2="262" stroke="#22c55e" stroke-width="3"/>
      <line x1="144" y1="10" x2="144" y2="262" stroke="#22c55e" stroke-width="2.5"/>
      <line x1="216" y1="10" x2="216" y2="262" stroke="#22c55e" stroke-width="2"/>
      <line x1="288" y1="10" x2="288" y2="262" stroke="#22c55e" stroke-width="1.7"/>
      <line x1="360" y1="10" x2="360" y2="262" stroke="#22c55e" stroke-width="1.4"/>

      <!-- String glows -->
      <line x1="72"  y1="10" x2="72"  y2="262" stroke="#22c55e" stroke-width="14" stroke-opacity="0.07"/>
      <line x1="144" y1="10" x2="144" y2="262" stroke="#22c55e" stroke-width="14" stroke-opacity="0.07"/>
      <line x1="216" y1="10" x2="216" y2="262" stroke="#22c55e" stroke-width="14" stroke-opacity="0.07"/>
      <line x1="288" y1="10" x2="288" y2="262" stroke="#22c55e" stroke-width="14" stroke-opacity="0.07"/>
      <line x1="360" y1="10" x2="360" y2="262" stroke="#22c55e" stroke-width="14" stroke-opacity="0.07"/>

      <!-- Mute X -->
      <line x1="-10" y1="-28" x2="10" y2="-8"  stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <line x1="10"  y1="-28" x2="-10" y2="-8" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

      <!-- Open circles: A, e -->
      <circle cx="72"  cy="-18" r="12" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <circle cx="360" cy="-18" r="12" fill="none" stroke="#22c55e" stroke-width="2.5"/>

      <!-- Finger 1: B fret1 -->
      <circle cx="288" cy="47" r="20" fill="#22c55e"/>
      <text x="288" y="54" font-family="Arial" font-size="16" font-weight="900" fill="#052e16" text-anchor="middle">1</text>

      <!-- Finger 2: D fret2 -->
      <circle cx="144" cy="131" r="20" fill="#22c55e"/>
      <text x="144" y="138" font-family="Arial" font-size="16" font-weight="900" fill="#052e16" text-anchor="middle">2</text>

      <!-- Finger 3: G fret2 -->
      <circle cx="216" cy="131" r="20" fill="#22c55e"/>
      <text x="216" y="138" font-family="Arial" font-size="16" font-weight="900" fill="#052e16" text-anchor="middle">3</text>

      <!-- Note labels -->
      <g font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">
        <text x="0"   y="284" fill="#3f1515">—</text>
        <text x="72"  y="284" fill="#22c55e">A2</text>
        <text x="144" y="284" fill="#22c55e">E3</text>
        <text x="216" y="284" fill="#22c55e">A3</text>
        <text x="288" y="284" fill="#22c55e">C4</text>
        <text x="360" y="284" fill="#22c55e">E4</text>
      </g>

      <!-- String name labels -->
      <g font-family="Arial" font-size="12" font-weight="600" text-anchor="middle" fill="#1c3a28">
        <text x="0"   y="302">E</text>
        <text x="72"  y="302">A</text>
        <text x="144" y="302">D</text>
        <text x="216" y="302">G</text>
        <text x="288" y="302">B</text>
        <text x="360" y="302">e</text>
      </g>
    </g>

    <!-- Subtitle under diagram -->
    <text x="255" y="468"
      font-family="Arial" font-size="16" font-weight="500" fill="#334155" text-anchor="middle">Thế bấm chuẩn quốc tế</text>
    <text x="255" y="492"
      font-family="monospace" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">A – C – E  ·  Minor triad</text>
  </g>
</svg>
